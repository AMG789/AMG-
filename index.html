<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار وأدعية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#1a365d,#2c5282);min-height:100vh;padding:20px;color:#fff}
        .container{max-width:600px;margin:0 auto}
        header{text-align:center;padding:30px 0}
        h1{font-size:2rem;margin-bottom:10px;color:#c9a227}
        .date{font-size:1rem;opacity:0.9}
        
        /* إشعار التنبيه */
        .notification{
            position:fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%) translateY(-150%);
            background:linear-gradient(135deg,#c9a227,#d4af37);
            color:#1a365d;
            padding:20px 30px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
            z-index:1000;
            font-weight:700;
            font-size:1.1rem;
            text-align:center;
            min-width:300px;
            transition:transform 0.5s ease;
            border:3px solid #fff;
        }
        .notification.show{transform:translateX(-50%) translateY(0)}
        .notification .close{
            position:absolute;
            top:5px;
            left:10px;
            background:none;
            border:none;
            font-size:1.5rem;
            cursor:pointer;
            color:#1a365d;
        }
        .notification-icon{font-size:2rem;margin-bottom:5px}
        
        /* نافذة التأكيد - ستايل التطبيق */
        .modal-overlay{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.7);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:2000;
            backdrop-filter:blur(5px);
        }
        .modal-overlay.show{display:flex}
        
        .modal-box{
            background:linear-gradient(135deg,#1a365d,#2c5282);
            border:3px solid #c9a227;
            border-radius:20px;
            padding:30px;
            width:90%;
            max-width:400px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
            animation:modalSlide 0.3s ease;
        }
        
        @keyframes modalSlide{
            from{transform:translateY(-50px);opacity:0}
            to{transform:translateY(0);opacity:1}
        }
        
        .modal-icon{
            font-size:3rem;
            margin-bottom:15px;
            color:#c9a227;
        }
        
        .modal-title{
            font-size:1.3rem;
            font-weight:700;
            margin-bottom:10px;
            color:#fff;
        }
        
        .modal-text{
            font-size:1rem;
            margin-bottom:25px;
            color:rgba(255,255,255,0.9);
            line-height:1.6;
        }
        
        .modal-buttons{
            display:flex;
            gap:15px;
            justify-content:center;
        }
        
        .modal-btn{
            padding:12px 30px;
            border:none;
            border-radius:10px;
            font-family:'Cairo',sans-serif;
            font-size:1rem;
            font-weight:700;
            cursor:pointer;
            transition:all 0.3s;
            flex:1;
        }
        
        .modal-btn.confirm{
            background:#c9a227;
            color:#1a365d;
        }
        .modal-btn.confirm:hover{
            background:#d4af37;
            transform:translateY(-2px);
        }
        
        .modal-btn.cancel{
            background:rgba(255,255,255,0.1);
            color:#fff;
            border:2px solid rgba(255,255,255,0.3);
        }
        .modal-btn.cancel:hover{
            background:rgba(255,255,255,0.2);
        }
        
        .tabs{display:flex;gap:10px;margin-bottom:20px;background:rgba(255,255,255,0.1);padding:5px;border-radius:15px}
        .tab{flex:1;padding:12px;border:none;background:transparent;color:#fff;font-family:'Cairo',sans-serif;font-size:0.9rem;cursor:pointer;border-radius:10px;transition:all 0.3s}
        .tab.active{background:#c9a227;color:#1a365d;font-weight:700}
        .content{display:none}
        .content.active{display:block}
        .progress{background:rgba(255,255,255,0.1);padding:15px;border-radius:15px;margin-bottom:20px;text-align:center}
        .progress-bar{width:100%;height:10px;background:rgba(255,255,255,0.2);border-radius:5px;margin:10px 0;overflow:hidden}
        .progress-fill{height:100%;background:#c9a227;border-radius:5px;transition:width 0.3s}
        .zekr-card{background:rgba(255,255,255,0.95);color:#1a365d;padding:20px;border-radius:15px;margin-bottom:15px;cursor:pointer;transition:all 0.3s;border-right:5px solid #c9a227;position:relative}
        .zekr-card:hover{transform:translateX(-5px);box-shadow:0 5px 20px rgba(0,0,0,0.2)}
        .zekr-card.completed{opacity:0.6;border-right-color:#38a169}
        .zekr-text{font-size:1.1rem;line-height:1.8;margin-bottom:10px}
        .zekr-info{display:flex;justify-content:space-between;align-items:center;font-size:0.9rem;color:#666}
        .count{background:#1a365d;color:#fff;padding:5px 15px;border-radius:20px;font-weight:700}
        .count.completed{background:#38a169}
        .reset-btn{width:100%;padding:15px;background:#e53e3e;color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:1rem;cursor:pointer;margin-top:20px;transition:all 0.3s}
        .reset-btn:hover{background:#c53030}
        .donation-box{background:rgba(255,255,255,0.1);padding:20px;border-radius:15px;margin-top:20px;text-align:center;border:2px solid #c9a227}
        .donation-box h3{color:#c9a227;margin-bottom:10px;font-size:1.2rem}
        .donation-box p{font-size:1rem;line-height:1.6;opacity:0.95}
        .footer-logo{text-align:center;margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.2)}
        .footer-logo p{font-size:1.2rem;color:#c9a227;letter-spacing:2px;font-weight:700;font-family:monospace}
        @media(max-width:600px){h1{font-size:1.5rem}.zekr-text{font-size:1rem}.tab{font-size:0.8rem;padding:10px 5px}}
    </style>
</head>
<body>
    <!-- إشعار التنبيه -->
    <div id="notification" class="notification">
        <button class="close" onclick="hideNotification()">×</button>
        <div class="notification-icon" id="notifIcon">☀️</div>
        <div id="notifText">تنبيه</div>
    </div>

    <!-- نافذة التأكيد -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">🔄</div>
            <div class="modal-title">إعادة ضبط العد</div>
            <div class="modal-text" id="modalText">هل تريد إعادة ضبط عداد الأذكار؟</div>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">إلغاء</button>
                <button class="modal-btn confirm" onclick="confirmReset()">تأكيد</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>📿 أذكار وأدعية</h1>
            <div class="date" id="currentDate"></div>
        </header>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('morning')">☀️ الصباح</button>
            <button class="tab" onclick="switchTab('evening')">🌙 المساء</button>
            <button class="tab" onclick="switchTab('dua')">🤲 الأدعية</button>
        </div>
        
        <div id="morning" class="content active">
            <div class="progress">
                <div>التقدم: <span id="morningProgress">0</span>%</div>
                <div class="progress-bar"><div class="progress-fill" id="morningBar" style="width:0%"></div></div>
            </div>
            <div id="morningAzkar"></div>
            <button class="reset-btn" onclick="showResetModal('morning')">🔄 إعادة ضبط العد</button>
        </div>
        
        <div id="evening" class="content">
            <div class="progress">
                <div>التقدم: <span id="eveningProgress">0</span>%</div>
                <div class="progress-bar"><div class="progress-fill" id="eveningBar" style="width:0%"></div></div>
            </div>
            <div id="eveningAzkar"></div>
            <button class="reset-btn" onclick="showResetModal('evening')">🔄 إعادة ضبط العد</button>
        </div>
        
        <div id="dua" class="content">
            <div class="progress">
                <div>التقدم: <span id="duaProgress">0</span>%</div>
                <div class="progress-bar"><div class="progress-fill" id="duaBar" style="width:0%"></div></div>
            </div>
            <div id="duaAzkar"></div>
            <button class="reset-btn" onclick="showResetModal('dua')">🔄 إعادة ضبط العد</button>
        </div>
        
        <div class="donation-box">
            <h3>🤲 صدقة جارية</h3>
            <p>اللهم اتنا في الدنيا حسنة وفي الأخرة حسنة وقنا عذاب النار<br>
            جعلها الله صدقة جارية لصاحبها ولمن ساهم في نشرها</p>
        </div> 
        
        <div class="footer-logo">
            <p>🌿</p>
            <p style="font-size:0.8rem;margin-top:5px;"> A.M.G </p>
        </div> 
    </div>

        const duaAzkar=[

        let currentResetType = '';
        
        // نظام الإشعارات
        function checkTimeAndNotify(){
            const now = new Date();
            const hour = now.getHours();
            
            if(hour >= 4 && hour < 8){
                showNotification('☀️', 'لا تنسَ أذكار الصباح');
            }
            else if(hour >= 16 && hour < 18){
                showNotification('🌙', 'لا تنسَ أذكار المساء');
            }
        }
        
        function showNotification(icon, text){
            const notification = document.getElementById('notification');
            document.getElementById('notifIcon').textContent = icon;
            document.getElementById('notifText').textContent = text;
            notification.classList.add('show');
            setTimeout(hideNotification, 5000);
        }
        
        function hideNotification(){
            document.getElementById('notification').classList.remove('show');
        }
        
        // نظام نافذة التأكيد
        function showResetModal(type){
            currentResetType = type;
            const modal = document.getElementById('confirmModal');
            const modalText = document.getElementById('modalText');
            
            let sectionName = '';
            if(type === 'morning') sectionName = 'أذكار الصباح';
            else if(type === 'evening') sectionName = 'أذكار المساء';
            else sectionName = 'الأدعية';
            
            modalText.textContent = `هل تريد إعادة ضبط عداد ${sectionName}؟`;
            modal.classList.add('show');
        }
        
        function closeModal(){
            document.getElementById('confirmModal').classList.remove('show');
            currentResetType = '';
        }
        
        function confirmReset(){
            if(currentResetType){
                let azkar;
                if(currentResetType === 'morning') azkar = morningAzkar;
                else if(currentResetType === 'evening') azkar = eveningAzkar;
                else azkar = duaAzkar;
                
                azkar.forEach(z => z.current = 0);
                saveData();
                renderAzkar(currentResetType);
                closeModal();
                
                // إشعار نجاح
                setTimeout(() => {
                    showNotification('✅','تم إعادة العد تقبل الله منك');
                }, 300);
            }
        }
        
        // باقي الدوال
        function loadData(){
            const savedMorning=localStorage.getItem('morningAzkar');
            const savedEvening=localStorage.getItem('eveningAzkar');
            const savedDua=localStorage.getItem('duaAzkar');
            if(savedMorning){const parsed=JSON.parse(savedMorning);morningAzkar.forEach((z,i)=>{if(parsed[i])z.current=parsed[i].current})}
            if(savedEvening){const parsed=JSON.parse(savedEvening);eveningAzkar.forEach((z,i)=>{if(parsed[i])z.current=parsed[i].current})}
            if(savedDua){const parsed=JSON.parse(savedDua);duaAzkar.forEach((z,i)=>{if(parsed[i])z.current=parsed[i].current})}
        }
        
        function saveData(){
            localStorage.setItem('morningAzkar',JSON.stringify(morningAzkar));
            localStorage.setItem('eveningAzkar',JSON.stringify(eveningAzkar));
            localStorage.setItem('duaAzkar',JSON.stringify(duaAzkar));
        }
        
        function renderAzkar(type){
            const container=document.getElementById(type+'Azkar');
            let azkar;
            if(type==='morning') azkar=morningAzkar;
            else if(type==='evening') azkar=eveningAzkar;
            else azkar=duaAzkar;
            
            container.innerHTML=azkar.map((z,i)=>{
                const sourceTag = z.source ? `<div style="font-size:0.8rem;color:#666;margin-top:5px;font-style:italic;">📖 ${z.source}</div>` : '';
                return `<div class="zekr-card ${z.current>=z.count?'completed':''}" onclick="increment('${type}',${i})">
                    <div class="zekr-text">${z.text}</div>
                    ${sourceTag}
                    <div class="zekr-info">
                        <span>اضغط للعد</span>
                        <span class="count ${z.current>=z.count?'completed':''}">${z.current}/${z.count}</span>
                    </div>
                </div>`
            }).join('');
            updateProgress(type);
        }
        
        function increment(type,index){
            let azkar;
            if(type==='morning') azkar=morningAzkar;
            else if(type==='evening') azkar=eveningAzkar;
            else azkar=duaAzkar;
            
            if(azkar[index].current<azkar[index].count){
                azkar[index].current++;
                saveData();
                renderAzkar(type);
            }
        }
        
        function updateProgress(type){
            let azkar;
            if(type==='morning') azkar=morningAzkar;
            else if(type==='evening') azkar=eveningAzkar;
            else azkar=duaAzkar;
            
            const total=azkar.reduce((s,z)=>s+z.count,0);
            const current=azkar.reduce((s,z)=>s+z.current,0);
            const p=Math.round((current/total)*100);
            document.getElementById(type+'Progress').textContent=p;
            document.getElementById(type+'Bar').style.width=p+'%';
        }
        
        function switchTab(type){
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(type).classList.add('active');
        }
        
        function setDate(){
            const options={weekday:'long',year:'numeric',month:'long',day:'numeric'};
            document.getElementById('currentDate').textContent=new Date().toLocaleDateString('ar-SA',options);
        }
        
        // تشغيل
        loadData();
        setDate();
        renderAzkar('morning');
        renderAzkar('evening');
        renderAzkar('dua');
        setTimeout(checkTimeAndNotify, 1000);
    </script>
</body>
</html>
